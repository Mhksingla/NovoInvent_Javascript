<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Product Table</title>

</head>

<body>

    <h1>Product Inventory</h1>

    <table border="1">

        <caption>
            Product Details
        </caption>

        <thead>

            <tr>

                <th>Product</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Category</th>
                <th>Status</th>

            </tr>

        </thead>

        <tbody>

            <tr>
                <td>Laptop</td>
                <td>50000</td>
                <td>12</td>
                <td>Electronics</td>
                <td>Available</td>
            </tr>

            <tr>
                <td>Mouse</td>
                <td>500</td>
                <td>30</td>
                <td>Accessories</td>
                <td>Available</td>
            </tr>

            <tr>
                <td>Keyboard</td>
                <td>1200</td>
                <td>20</td>
                <td>Accessories</td>
                <td>Available</td>
            </tr>

            <tr>
                <td>Monitor</td>
                <td>10000</td>
                <td>5</td>
                <td>Electronics</td>
                <td>Low Stock</td>
            </tr>

        </tbody>

        <tfoot>

            <tr>

                <td colspan="5">
                    Inventory Updated
                </td>

            </tr>

        </tfoot>

    </table>

</body>
</html>
