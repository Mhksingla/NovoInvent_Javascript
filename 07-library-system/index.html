<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Library System</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

    <h1>Library Management</h1>

    <!-- FORM -->

    <form id="bookForm">

        <input
          type="text"
          id="title"
          placeholder="Book Title"
          required>

        <input
          type="text"
          id="author"
          placeholder="Author"
          required>

        <input
          type="text"
          id="isbn"
          placeholder="ISBN"
          required>

        <button type="submit">
            Add Book
        </button>

    </form>

    <!-- BOOK LIST -->

    <div id="bookList">

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
