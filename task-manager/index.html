<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <link
      rel="stylesheet"
      href="style.css">

</head>

<body>

<div class="container">

    <h1>Task Management System</h1>

    <!-- FORM -->

    <form id="taskForm">

        <input
          type="text"
          id="taskTitle"
          placeholder="Enter task title"
          required>

        <input
          type="number"
          id="taskHours"
          placeholder="Hours"
          required>

        <button type="submit">
            Add Task
        </button>

    </form>

    <!-- FILTER -->

    <div class="top-bar">

        <button id="showPending">
            Show Pending
        </button>

        <button id="showAll">
            Show All
        </button>

    </div>

    <!-- TASK LIST -->

    <div id="taskList">

    </div>

    <!-- TOTAL -->

    <div id="totalHours">

        Total Hours: 0

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
