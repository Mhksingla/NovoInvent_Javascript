<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0">

    <title>Modern CSS Features</title>

    <link
      rel="stylesheet"
      href="style.css">

</head>

<body>

<!-- DARK MODE TOGGLE -->

<div class="theme-toggle">

    <input
      type="checkbox"
      id="darkMode">

    <label for="darkMode">
        Dark Mode
    </label>

</div>

<!-- CARD -->

<div class="wrapper">

    <div class="card">

        <input
          type="checkbox"
          id="active">

        <label for="active">
            Active Card
        </label>

        <h2>Mehak</h2>

        <p>
            Exploring modern CSS features.
        </p>

        <button>
            View Profile
        </button>

    </div>

</div>

</body>
</html>
