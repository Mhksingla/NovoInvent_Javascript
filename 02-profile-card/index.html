<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0">

    <title>Profile Card</title>

    <link
      rel="stylesheet"
      href="style.css">

</head>

<body>

<div class="card">

    <img
      src="https://i.pravatar.cc/300"
      alt="Profile Picture">

    <h1>User</h1>

    <p class="role">
        Frontend Developer
    </p>

    <p class="description">

        Passionate about building
        responsive and accessible
        web applications.

    </p>

    <button>
        View Profile
    </button>

</div>

</body>
</html>
